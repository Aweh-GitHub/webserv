services:
  database:
    image: docker.io/library/mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./wordpress.sql:/docker-entrypoint-initdb.d/wordpress.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  webserv:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_HOME: http://localhost:8080/wordpress

volumes:
  mariadb_data: